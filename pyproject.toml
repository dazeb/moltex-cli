[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltex"
version = "3.0.0"
description = "CLI installer and client for the MOLTEX PRO Agent Memecoin Exchange"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MOLTEX Protocol" },
]
dependencies = [
    "pynacl>=1.5.0",
    "requests>=2.31.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
moltex = "moltex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["moltex"]
